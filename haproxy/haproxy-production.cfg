# Production pattern: SSL passthrough (mode tcp). Do NOT put "ssl" on server lines.
# TLS + PIN1 client cert must reach IIS / HTTP.sys unchanged.
#
# Health is HTTP on a separate port WITHOUT client cert.
# Copy pieces into external vs internal HAProxy as needed.
#
# Syntax here is HAProxy 2.x (req.ssl_hello_type, req.ssl_sni). On 1.8 use the
# underscore form (req_ssl_hello_type, req_ssl_sni).
# Check before deploying:
#   docker run --rm -v "$PWD:/cfg:ro" haproxy:2.9-alpine haproxy -c -f /cfg/haproxy-production.cfg

global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout check 2s

# ----- External HAProxy (public VIP :443) -----
frontend https_front
    mode tcp
    bind *:443
    # optional: tcp-request inspect-delay 5s  +  accept if { req_ssl_hello_type 1 }
    default_backend internal_haproxy

backend internal_haproxy
    mode tcp
    balance roundrobin
    # If the NEXT hop is another HAProxy and you want IP affinity, send PROXY:
    # server int1 10.0.0.2:443 send-proxy-v2 check
    server int1 10.0.0.2:443 check
    server int2 10.0.0.3:443 check

# ----- Internal HAProxy (in front of IIS VMs) -----
frontend iis_front
    mode tcp
    bind *:443
    # accept-proxy   # uncomment if the external hop uses send-proxy-v2

    # In passthrough IIS logs the LB IP as c-ip, so the only way to tie a user
    # to a backend is: LB log (client ip:port, chosen server, SNI) + time +
    # the cert thumbprint in the application log.
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content capture req.ssl_sni len 64
    tcp-request content accept if { req.ssl_hello_type 1 }
    log-format "%ci:%cp [%tr] %ft %b/%s conn=%Tw/%Tc/%Tt bytes=%B term=%ts sni=%[capture.req.hdr(0)]"

    default_backend iis_backends

backend iis_backends
    mode tcp
    balance roundrobin
    # WCF Keep-Alive already sticks a client to one IIS for the TCP lifetime.
    # Use "balance source" only if you also need same-backend on NEW connections
    # from the same client IP. With two HAProxy layers, source without PROXY
    # hashes the EXTERNAL proxy IP => all users land on one IIS.
    option httpchk GET /health.json
    http-check expect status 200
    # Health must hit the SAME app pool as the WCF app, otherwise a dead pool
    # still reports UP. Keep the check WITHOUT a client certificate.
    #
    # Maintenance behaviour, decide explicitly and document it:
    #   with    -> drain/down kills established TLS sessions (one visible error,
    #              then the client reconnects to a healthy IIS)
    #   without -> existing connections keep being served, the backend does not
    #              actually empty; your failover test may pass for the wrong reason
    # on-marked-down shutdown-sessions
    server iis1 10.0.0.11:443 check port 8080
    server iis2 10.0.0.12:443 check port 8080
    # WRONG: server iis1 10.0.0.11:443 ssl verify none
    #        that terminates TLS; IIS never sees the ID-card cert.

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats admin if TRUE
