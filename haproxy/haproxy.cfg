global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout tunnel 1h
    timeout check 2s

frontend https_front
    mode tcp
    bind *:443
    default_backend iis_backends

backend iis_backends
    mode tcp
    balance roundrobin
    option httpchk GET /health.json
    http-check expect status 200
    # Lab: kaks IIS saiti Hyper-V VM-is (passthrough — TLS lõpeb IIS-is)
    server Backend1 192.168.56.10:8443 check port 8080
    server Backend2 192.168.56.10:8444 check port 8081
    # Host IIS Express:
    # server Backend1 host.docker.internal:8443 check port 8080
    # server Backend2 host.docker.internal:8444 check port 8081
    # Kaks Windows Serverit (SSL passthrough — ära tee ssl-i serveri real):
    # server Backend1 10.0.0.11:443 check port 8080
    # server Backend2 10.0.0.12:443 check port 8080

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats admin if TRUE
